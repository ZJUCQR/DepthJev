name: lint
on:
  push:
  pull_request:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check geolingo
      - run: ruff format --check geolingo
      - run: bash -n scripts/*.sh
  # geolingo/evaluation runs in the Python 3.9 evaluation environment with the standard library only
  py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m py_compile geolingo/__init__.py geolingo/evaluation/*.py
      - run: python -m geolingo.evaluation.report --help
