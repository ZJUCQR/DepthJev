name: lint
on:
  push:
  pull_request:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check depthjev
      - run: ruff format --check depthjev
      - run: bash -n scripts/*.sh
  # depthjev/evaluation runs in the Python 3.9 evaluation environment with the standard library only
  py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m py_compile depthjev/__init__.py depthjev/evaluation/*.py
      - run: python -m depthjev.evaluation.report --help
